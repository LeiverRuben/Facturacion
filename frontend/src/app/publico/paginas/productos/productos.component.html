<div class="container my-5">

  <h1 class="text-center mb-4">Nuestros Productos</h1>


  <div class="row mb-4">
    <div class="col-md-6 mx-auto">
      <input
        type="text"
        class="form-control"
        placeholder="Buscar producto..."
        [(ngModel)]="filtro"
        (input)="aplicarFiltro()"
      >
    </div>
  </div>


  <div *ngIf="cargando" class="text-center">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Cargando productos...</p>
  </div>


  <div class="row" *ngIf="!cargando">

    <div
      class="col-12 col-sm-6 col-md-4 mb-4"
      *ngFor="let p of productosPaginados"
    >
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">

          <h5 class="card-title">{{ p.productoNombre }}</h5>

          <span class="badge bg-secondary mb-2">
            {{ p.productoCategoria }}
          </span>

          <p class="fw-bold text-success fs-5">
            {{ p.productoPrecio | currency:'USD' }}
          </p>

          <p
            class="mt-auto"
            [ngClass]="{
              'text-success': p.productoStock > 0,
              'text-danger': p.productoStock === 0
            }"
          >
            {{ p.productoStock > 0 ? 'Stock: ' + p.productoStock : 'Sin stock' }}
          </p>

        </div>
      </div>
    </div>

  </div>

  
  <div class="d-flex justify-content-center mt-4" *ngIf="totalPaginas > 1">
    <ul class="pagination">

      <li class="page-item" [class.disabled]="paginaActual === 1">
        <button class="page-link" (click)="cambiarPagina(paginaActual - 1)">
          Anterior
        </button>
      </li>

      <li
        class="page-item"
        *ngFor="let p of paginas"
        [class.active]="p === paginaActual"
      >
        <button class="page-link" (click)="cambiarPagina(p)">
          {{ p }}
        </button>
      </li>

      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <button class="page-link" (click)="cambiarPagina(paginaActual + 1)">
          Siguiente
        </button>
      </li>

    </ul>
  </div>

</div>
