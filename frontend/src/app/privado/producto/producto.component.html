<div class="container my-4">

  <!-- TÍTULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary">
      <i class="bx bx-package"></i> Gestión de Productos
    </h2>
  </div>

  <!-- FORMULARIO -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <i class="bx bx-edit"></i>
      {{ editando ? 'Editar producto' : 'Nuevo producto' }}
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="guardar()">

        <div class="row g-3">

          <div class="col-md-3">
            <label class="form-label">Serial</label>
            <input class="form-control" formControlName="productoSerial">
          </div>

          <div class="col-md-5">
            <label class="form-label">Nombre</label>
            <input class="form-control" formControlName="productoNombre">
          </div>

          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <input class="form-control" formControlName="productoCategoria">
          </div>

          <div class="col-md-4">
            <label class="form-label">Precio</label>
            <input type="number" class="form-control" formControlName="productoPrecio">
          </div>

          <div class="col-md-4">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" formControlName="productoStock">
          </div>

          <div class="col-md-4">
            <label class="form-label">IVA (%)</label>
            <input type="number" class="form-control" formControlName="productoTasa">
          </div>

        </div>

        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-success" type="submit">
            <i class="bx bx-save"></i>
            {{ editando ? 'Actualizar' : 'Guardar' }}
          </button>

          <button class="btn btn-outline-secondary" type="button" *ngIf="editando" (click)="cancelar()">
            <i class="bx bx-x-circle"></i> Cancelar
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- BUSCADOR -->
  <div class="row mb-3">
    <div class="col-md-6">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-light">
          <i class="bx bx-search"></i>
        </span>
        <input type="text" class="form-control" placeholder="Buscar por nombre o categoría..." [(ngModel)]="filtro"
          (input)="aplicarFiltro()" />
      </div>
    </div>
  </div>

  <!-- LISTADO -->
  <div class="row">

    <div class="col-xl-3 col-lg-4 col-md-6 mb-4" *ngFor="let p of productosPaginados">
      <div class="card h-100 shadow-sm border-0 product-card">

        <div class="card-body">
          <h6 class="fw-bold text-dark mb-1">
            {{ p.productoNombre }}
          </h6>

          <span class="badge bg-secondary mb-2">
            {{ p.productoCategoria }}
          </span>

          <p class="fw-bold text-success mb-1">
            {{ p.productoPrecio | currency:'USD' }}
          </p>

          <p class="mb-0" [ngClass]="{
              'text-success': p.productoStock > 0,
              'text-danger': p.productoStock === 0
            }">
            <i class="bx bx-box"></i>
            {{ p.productoStock > 0 ? 'Stock: ' + p.productoStock : 'Sin stock' }}
          </p>
        </div>

        <div class="card-footer bg-white border-0 d-flex justify-content-between">
          <button class="btn btn-sm btn-outline-warning" (click)="editar(p)">
            <i class="bx bx-pencil"></i>
          </button>

          <button class="btn btn-sm btn-outline-danger" (click)="eliminar(p.productoId)">
            <i class="bx bx-trash"></i>
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- PAGINACIÓN -->
  <nav *ngIf="totalPaginas > 1" class="mt-4">
    <ul class="pagination justify-content-center">

      <li class="page-item" [class.disabled]="paginaActual === 1">
        <button class="page-link" (click)="cambiarPagina(paginaActual - 1)">
          «
        </button>
      </li>

      <li class="page-item" *ngFor="let p of paginas" [class.active]="paginaActual === p">
        <button class="page-link" (click)="cambiarPagina(p)">
          {{ p }}
        </button>
      </li>

      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <button class="page-link" (click)="cambiarPagina(paginaActual + 1)">
          »
        </button>
      </li>

    </ul>
  </nav>

</div>
