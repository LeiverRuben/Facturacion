<div class="layout-wrapper">

  <!-- Sidebar Premium -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-circle">
        <i class='bx bxs-store'></i>
      </div>
      <h3 class="brand-name">Facturación</h3>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li>
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-dashboard'></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-label">GESTIÓN</li>
        <li>
          <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-user-detail'></i>
            <span>Clientes</span>
          </a>
        </li>
        <li>
          <a routerLink="/productos" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-package'></i>
            <span>Productos</span>
          </a>
        </li>
        <li>
          <a routerLink="/facturacion" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-file-plus'></i>
            <span>Facturación</span>
          </a>
        </li>
        <li>
          <a routerLink="/proveedores" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-truck'></i>
            <span>Proveedores</span>
          </a>
        </li>
        <li>
          <a routerLink="/compras" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-cart-download'></i>
            <span>Ingreso Compras</span>
          </a>
        </li>
        <li>
          <a routerLink="/caja" routerLinkActive="active" class="nav-item">
            <i class='bx bxs-wallet'></i>
            <span>Control de Caja</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">

      <!-- Settings Menu Trigger -->
      <div class="settings-container" [class.active]="showSettingsMenu">
        <button class="btn-settings" (click)="toggleSettings()" title="Configuración">
          <i class='bx bx-cog'></i>
          <span>Configuración</span>
        </button>

        <!-- Popup Menu -->
        <div class="settings-popup" *ngIf="showSettingsMenu">
          <div class="settings-header">Preferencias</div>
          <button class="settings-item" (click)="toggleTheme()">
            <i class='bx' [ngClass]="isDarkMode ? 'bx-sun' : 'bx-moon'"></i>
            <span>{{ isDarkMode ? 'Modo Claro' : 'Modo Oscuro' }}</span>
          </button>
        </div>
      </div>

      <button class="btn-logout" (click)="logout()">
        <i class='bx bx-log-out'></i> Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
